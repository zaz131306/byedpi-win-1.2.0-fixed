name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests (без curl_cffi — Chrome-транспорт скипнется)
        run: python tests/run_all.py

  python-tests-curl-cffi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: venv + curl_cffi (как в README)
        run: |
          python3 -m venv /tmp/tunnel-venv
          /tmp/tunnel-venv/bin/pip install curl_cffi
      - name: Run tests with curl_cffi
        env:
          BYEDPI_PY: /tmp/tunnel-venv/bin/python
        run: python3 tests/run_all.py

  audit-offset-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 host/audit_offset_flags.py .

  build-xpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tools/build_xpi.py
      - run: python3 tools/build_xpi.py --simple
      - uses: actions/upload-artifact@v4
        with:
          name: xpi
          path: |
            dist/*.xpi
            release/*-installer.zip
