name: ci
on: [push, pull_request, workflow_dispatch]

jobs:
  python-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run unit tests (в корне)
        run: |
          python -m unittest test_diag_verdict test_dnsfix test_hosts_groups -v

  bat-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: BAT syntax tests
        run: python -m unittest test_bat_syntax -v

  smoke-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: --help для CLI (если поддерживается)
        run: |
          for f in DIAG.py DNSFIX.py NETSTAT.py synth.py yamlcheck.py orchestrate.py WL-check.py; do
            echo "=== $f ==="
            python3 "$f" --help >/dev/null 2>&1 && echo OK || echo "no --help / failed (ok)"
          done
